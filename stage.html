<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No More Snooping Altman</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#14151a; --mute:#71717a; --faint:#a1a1aa; --line:#e7e5e0;
  --run:#4f46e5; --ok:#059669; --bad:#e11d48; --warn:#d97706;
  --dh: calc(100vh - 300px);
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}

.top{display:flex;align-items:center;gap:14px;padding:18px 36px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.3px;margin-right:18px}
.brand span{color:var(--faint);font-weight:500}
select,.btn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;transition:border-color .2s}
.btn:hover,select:hover{border-color:#cfccc4}
.btn.go{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;padding:9px 22px}
.btn.go:disabled{opacity:.4;cursor:default}
.stats{margin-left:auto;display:flex;gap:26px}
.stat{font-size:12.5px;color:var(--mute)}
.stat b{display:block;font-size:20px;color:var(--ink);font-weight:650;letter-spacing:-.4px}
.stat.zero b{color:var(--ok)}

.track{display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;height:calc(100vh - 88px);padding:8px 36px 28px;scroll-behavior:smooth}
.track::-webkit-scrollbar{height:6px}.track::-webkit-scrollbar-thumb{background:#dcd9d2;border-radius:6px}
.card{flex:0 0 auto;display:flex;flex-direction:column;background:var(--card);border-radius:24px;padding:22px 24px 18px;min-width:340px;
  box-shadow:0 1px 2px rgba(20,20,30,.04),0 18px 50px -18px rgba(20,20,40,.12);opacity:.35;transform:translateY(8px);transition:opacity .8s var(--ease),transform .8s var(--ease),box-shadow .8s}
.card[data-s="run"],.card[data-s="ok"],.card[data-s="blocked"]{opacity:1;transform:none}
.card[data-s="run"]{box-shadow:0 1px 2px rgba(20,20,30,.04),0 24px 70px -20px rgba(79,70,229,.28)}
.card[data-s="blocked"]{box-shadow:0 0 0 2px rgba(225,29,72,.5),0 24px 70px -20px rgba(225,29,72,.3)}
.card[data-s="skip"]{opacity:.18}
.hd{display:flex;align-items:baseline;gap:10px}
.n{font:600 12px var(--mono);color:var(--faint)}
.hd h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.3px}
.st{margin-left:auto;font-size:12px;font-weight:600;color:var(--faint);display:flex;align-items:center;gap:6px}
[data-s="run"] .st{color:var(--run)} [data-s="ok"] .st{color:var(--ok)} [data-s="blocked"] .st{color:var(--bad)}
.spin{width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.who{font-size:12.5px;color:var(--mute);margin:3px 0 16px}
.who i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 5px 0 0;vertical-align:1px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:22px;min-height:0}
.paper{position:relative;height:var(--dh);aspect-ratio:1240/1754;background:#fff;border-radius:6px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.06),0 14px 40px -12px rgba(20,20,40,.25);flex:0 0 auto}
.paper.empty{background:#fbfaf8;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
.paper>*{position:absolute;inset:0;width:100%;height:100%}
.fade{animation:fade .9s var(--ease) both}
@keyframes fade{from{opacity:0;transform:scale(.985)}}
.arrow{width:46px;height:2px;background:var(--ink);position:relative;opacity:.8;transform-origin:left;animation:grow .7s var(--ease) both;flex:0 0 auto}
.arrow::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left:9px solid var(--ink);border-right:0}
@keyframes grow{from{transform:scaleX(0)}}
.res{margin-top:16px;display:flex;gap:22px;align-items:flex-end;min-height:46px}
.kv{font-size:12px;color:var(--mute);animation:fade .7s var(--ease) both}
.kv b{display:block;font-size:22px;font-weight:650;letter-spacing:-.5px;color:var(--ink)}
.kv.g b{color:var(--ok)} .kv.r b{color:var(--bad)} .kv.y b{color:var(--warn)}
.logs{margin-left:auto;align-self:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font:600 11.5px var(--mono);color:var(--mute);cursor:pointer}
.logs:hover{color:var(--ink);border-color:#cfccc4}
.link{flex:0 0 56px;display:flex;align-items:center;justify-content:center}
.link div{height:2px;width:0;background:#d4d1ca;transition:width .9s var(--ease)}
.link.on div{width:34px;background:var(--ink)}
.link.bad div{background:var(--bad)}

.rows{width:100%;max-width:360px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;animation:fade .6s var(--ease) both}
.row:last-child{border-bottom:0}
.row .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 22px;background:#f1f0ec;color:var(--faint)}
.row.ok .ic{background:#d1fae5;color:var(--ok)} .row.bad .ic{background:#ffe4e6;color:var(--bad)}
.row small{margin-left:auto;color:var(--faint);font:12px var(--mono)}
.paper.mini{height:200px;margin:0 auto 14px;position:relative}
.paper.mini .lines{position:absolute;inset:26px 20px auto 20px;height:auto;width:auto;display:flex;flex-direction:column;gap:9px}
.paper.mini .lines i{display:block;height:6px;border-radius:3px;background:#eceae5}
.paper.mini .ext{position:absolute;left:auto;top:auto;width:auto;height:auto;right:12px;bottom:12px;font-size:11px;font-weight:700;letter-spacing:1px;color:#fff;background:var(--ink);padding:3px 7px;border-radius:5px}
.paper.mini>.stamp{font-size:18px;padding:6px 12px}
.file{font-weight:600;font-size:15px;text-align:center;margin-bottom:14px;word-break:break-all}
.file small{display:block;color:var(--faint);font:12px var(--mono);margin-top:4px}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);
  border:3px solid var(--bad);color:var(--bad);background:rgba(255,255,255,.94);font-weight:800;font-size:26px;letter-spacing:3px;padding:8px 20px;border-radius:12px;animation:stamp .5s var(--ease) both;z-index:5}
.paper>.stamp{inset:auto;width:auto;height:auto;left:50%;top:50%}
@keyframes stamp{from{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(1.6)}}
.why{color:var(--bad);font-size:14px;max-width:380px;text-align:center;margin:12px auto 0}
.side{display:flex;flex-direction:column;width:240px}
.pair{font-size:13px;padding:9px 0;border-bottom:1px solid var(--line);animation:fade .6s var(--ease) both}
.pair s{color:var(--faint);text-decoration-color:var(--bad)} .pair b{display:block;color:var(--ok);font-weight:600}

.cmp{position:relative;height:var(--dh);aspect-ratio:1240/1754;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 14px 40px -12px rgba(20,20,40,.25);flex:0 0 auto;background:#fff}
.cmp img{position:absolute;inset:0;width:100%;height:100%}
.cmp .over{clip-path:inset(0 0 0 50%)}
.cmp .bar{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--ink)}
.cmp .bar::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.tag{position:absolute;top:10px;font-weight:600;font-size:10.5px;letter-spacing:.8px;padding:4px 8px;border-radius:6px;background:rgba(20,21,26,.75);color:#fff;z-index:2}
.chatbox{width:380px;display:flex;flex-direction:column;height:var(--dh)}
.chatbox h3{margin:0 0 4px;font-size:17px;letter-spacing:-.2px}
.chatbox p{margin:0 0 14px;color:var(--mute);font-size:13px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msg{font-size:13.5px;padding:11px 13px;border-radius:14px;background:#f5f4f0;white-space:pre-wrap;animation:fade .6s var(--ease) both}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end;max-width:85%}
.msg em{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--faint);margin-bottom:4px;letter-spacing:.3px}
.msg.cloud{background:#eef2ff} .msg.cloud em{color:var(--run)}
.msg.you{background:#ecfdf5} .msg.you em{color:var(--ok)}
.ask{display:flex;gap:8px;margin-top:12px}
.ask input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.mini{display:flex;gap:14px;margin-top:12px}
.mini button,.mini a{border:0;background:none;color:var(--mute);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#d4d1ca}
.mini button:hover,.mini a:hover{color:var(--ink)}
.note{font-size:12.5px;padding:10px 12px;border-radius:12px;animation:fade .6s var(--ease) both}
.note.bad{background:#fff1f2;color:#9f1239}

.expand{position:absolute;right:10px;bottom:10px;z-index:3;width:34px;height:34px;border-radius:10px;border:0;background:rgba(20,21,26,.78);color:#fff;cursor:pointer;font-size:16px;display:grid;place-items:center;transition:transform .2s}
.expand:hover{transform:scale(1.08)}
.lb{position:fixed;inset:0;z-index:40;background:rgba(245,244,240,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.lb.open{opacity:1;pointer-events:auto}
.lb .cmp{height:calc(100vh - 110px);transform:scale(.96);transition:transform .55s var(--ease)}
.lb.open .cmp{transform:none}
.lbbar{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.drawer{position:fixed;left:24px;right:24px;bottom:0;height:52vh;z-index:20;background:#0c0d12;border-radius:18px 18px 0 0;box-shadow:0 -30px 80px rgba(0,0,0,.25);
  transform:translateY(105%);transition:transform .5s var(--ease);display:flex;flex-direction:column;font:12px/1.6 var(--mono);color:#c9d1e0}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.07);color:#86efac}
.dh button{background:none;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#c9d1e0;padding:3px 10px;cursor:pointer;font:12px var(--mono)}
.dh .sp{margin-left:auto}
.db{overflow:auto;padding:12px 20px 30px;flex:1}
.lg{white-space:pre-wrap;word-break:break-word;margin-bottom:3px}
.lg .t{color:#4b5563} .lg .h{color:#374151}
.kp{color:#c4b5fd} .km{color:#93c5fd} .kl{color:#86efac} .kt{color:#fcd34d}
.ALLOW{color:#86efac} .BLOCK,.QUARANTINE,.DROP{color:#fda4af} .OVERRIDE,.REWRITE,.FALLBACK{color:#fcd34d}
.lg details{margin:2px 0 4px 20px} .lg summary{cursor:pointer;color:#6b7280}
.lg pre{margin:4px 0;padding:8px 10px;background:rgba(255,255,255,.03);border-radius:6px;white-space:pre-wrap;max-height:260px;overflow:auto;color:#9ca3af}
</style>
</head>
<body>
<div class="top">
  <div class="brand">No More Snooping Altman</div>
  <select id="sample"></select>
  <label class="btn">Upload<input id="file" type="file" accept="image/*,.pdf" hidden></label>
  <button class="btn go" id="go">Run</button>
  <div class="stats">
    <div class="stat"><b id="sTime">0.0s</b>elapsed</div>
    <div class="stat"><b id="sCloud">0</b>cloud requests</div>
    <div class="stat zero"><b id="sRaw">0</b>personal values sent</div>
    <div class="stat"><b id="sChain">—</b>audit chain</div>
  </div>
</div>
<div class="track" id="track"></div>
<div class="lb" id="lb">
  <div class="lbbar"><div class="seg" id="seg"><button data-v="0">Original</button><button data-v="50" class="on">Compare</button><button data-v="100">Anonymised</button></div>
    <a class="btn" id="lbDl" target="_blank" style="text-decoration:none;color:var(--ink)">Download PDF</a><button class="btn" id="lbX">Close  esc</button></div>
  <div class="cmp" id="lbCmp"><img id="lbA"><img class="over" id="lbB"><div class="bar" id="lbBar"></div>
    <span class="tag" style="left:10px">ORIGINAL</span><span class="tag" style="right:10px;background:rgba(5,150,105,.9)">ANONYMISED</span><input type="range" id="lbSl" value="50"></div>
</div>
<div class="drawer" id="drawer"><div class="dh"><span id="dT">trace</span><button class="sp" id="dV">verify chain</button><button id="dX">close</button></div><div class="db" id="dB"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const C = {cloud:"#4f46e5", local:"#059669", tool:"#d97706", code:"#7c3aed"};

const STAGES = [
  {id:"intake", t:"Intake",            who:[["Gatekeeper · code","code"]]},
  {id:"ocr",    t:"Read the page",     who:[["Apple Vision · on-device","tool"]]},
  {id:"gemma",  t:"Understand",        who:[["Analyst · Gemma 4","local"],["Sentinel · Gemma 4","local"]]},
  {id:"guard",  t:"Decide",            who:[["Policy · code, not a model","code"]]},
  {id:"erase",  t:"Erase",             who:[["Eraser · on-device","tool"]]},
  {id:"paint",  t:"Redraw",            who:[["Renderer · on-device","tool"]]},
  {id:"verify", t:"Verify",            who:[["Verifier · Gemma 4","local"],["Pixel check · code","code"]]},
  {id:"result", t:"Result", who:[["Coordinator · Gemini","cloud"],["Assistant · Gemini","cloud"]]},
];
const IDX = Object.fromEntries(STAGES.map((s, i) => [s.id, i]));
const TOOL = {load_document:"ocr", analyse_document:"gemma", redact_document:"erase", verify_document:"verify", finalize:"result"};
const GATE = {size_limit:"Size", file_type:"File type", pdf_active_content:"No scripts in PDF", decompression_bomb:"Pixel bomb", resolution:"Resolution"};

let S;
function reset(){ S = {run:null, all:[], logs:{}, cur:null, doc:null, imgs:{}, cloud:0, blocked:false, done:false, inj:new Set(), t:{}, pend:[]}; STAGES.forEach(s => S.logs[s.id] = []); }
reset();

function build(){
  const t = $("#track"); t.innerHTML = "";
  STAGES.forEach((s, i) => {
    if (i) t.insertAdjacentHTML("beforeend", `<div class="link" id="l-${s.id}"><div></div></div>`);
    t.insertAdjacentHTML("beforeend", `<section class="card" id="c-${s.id}" data-s="idle">
      <div class="hd"><span class="n">${String(i + 1).padStart(2, "0")}</span><h2>${s.t}</h2><span class="st"></span></div>
      <div class="who">${s.who.map(([n, z]) => `<span style="margin-right:14px"><i style="background:${C[z]}"></i>${n}</span>`).join("")}</div>
      <div class="stage"><div class="paper empty"></div></div>
      <div class="res"><button class="logs" data-id="${s.id}">logs · <span>0</span></button></div></section>`);
  });
  t.querySelectorAll(".logs").forEach(b => b.onclick = () => openLog(b.dataset.id));
}
const card = id => $("#c-" + id), stage = id => card(id).querySelector(".stage");
function setS(id, s, label){ const c = card(id); c.dataset.s = s;
  c.querySelector(".st").innerHTML = s === "run" ? `<span class="spin"></span>${label || "working"}` : s === "ok" ? (label || "done") : s === "blocked" ? "blocked" : ""; }
function kv(id, label, val, cls = ""){ card(id).querySelector(".logs").insertAdjacentHTML("beforebegin", `<div class="kv ${cls}"><b>${esc(val)}</b>${label}</div>`); }

async function activate(id){
  S.cur = id; S.t[id] = performance.now();
  if (IDX[id]) $("#l-" + id).classList.add("on");
  setS(id, "run");
  card(id).scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
  await sleep(1200);
}
async function finish(id, label){
  const left = 2400 - (performance.now() - S.t[id]); if (left > 0) await sleep(left);
  setS(id, "ok", label); await sleep(800);
}
async function block(id, why){
  S.blocked = true; setS(id, "blocked");
  const st = stage(id), p = st.querySelector(".paper");
  if (p) p.insertAdjacentHTML("beforeend", `<div class="stamp">BLOCKED</div>`);
  else { st.style.position = "relative"; st.insertAdjacentHTML("beforeend", `<div class="stamp">BLOCKED</div>`); }
  st.insertAdjacentHTML("afterend", `<div class="why">${esc(why)}</div>`);
  STAGES.slice(IDX[id] + 1).forEach(s => setS(s.id, "skip"));
  const nx = STAGES[IDX[id] + 1]; if (nx) $("#l-" + nx.id).classList.add("on", "bad");
  card(id).scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
}

/* logs */
function log(id, ev){ S.logs[id].push(ev); card(id).querySelector(".logs span").textContent = S.logs[id].length; if (openId === id) line(ev); }
let openId = null;
function openLog(id){
  openId = id; $("#dT").textContent = `▌ ${STAGES[IDX[id]].t.toLowerCase()} · ${S.logs[id].length} events · ${S.run || ""}`;
  $("#dB").innerHTML = `<div class="lg"><span class="t">$</span> tail audit/${S.run || "run"}.jsonl --stage ${id}</div>`;
  S.logs[id].forEach((ev, i) => setTimeout(() => openId === id && line(ev), i * 35));
  $("#drawer").classList.add("open");
}
function line(ev){
  const kc = ev.kind === "policy" ? "kp" : ev.kind.startsWith("model") ? (ev.zone === "local" ? "kl" : "km") : "kt";
  const ex = [ev.ms != null && `${ev.ms}ms`, ev.tokens && `${ev.tokens.in}→${ev.tokens.out} tok`, ev.zone].filter(Boolean).join(" · ");
  let h = `<span class="t">+${ev.ts.toFixed(2)}s #${ev.seq}</span> <span class="${kc}">${ev.kind.toUpperCase()}</span> ${esc(ev.agent || "")}${ev.name ? "." + esc(ev.name) : ""}${ev.decision ? ` <span class="${ev.decision}">${ev.decision}</span>` : ""} <span class="t">${ex}</span>`;
  if (ev.detail) h += `\n   ${esc(ev.detail.slice(0, 500))}${ev.detail.length > 500 ? " …" : ""}`;
  if (ev.payload) h += `<details><summary>prompt sent by this agent (scrubbed)</summary><pre>${esc(ev.payload)}</pre></details>`;
  if (ev.kind === "model_end" && ev.detail?.length > 500) h += `<details><summary>full model output</summary><pre>${esc(ev.detail)}</pre></details>`;
  h += `\n   <span class="h">hash ${ev.hash.slice(0, 16)} ← ${ev.prev.slice(0, 16)}</span>`;
  $("#dB").insertAdjacentHTML("beforeend", `<div class="lg">${h}</div>`); $("#dB").scrollTop = 1e7;
}
$("#dX").onclick = () => { $("#drawer").classList.remove("open"); openId = null; };
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if ($("#lb").classList.contains("open")) closeLb(); else $("#dX").onclick(); });
function setLb(v){ $("#lbSl").value = v; $("#lbB").style.clipPath = `inset(0 0 0 ${v}%)`; $("#lbBar").style.left = v + "%"; $("#lbBar").style.opacity = v > 0 && v < 100 ? 1 : 0;
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", +b.dataset.v === +v)); }
function openLb(){ $("#lbA").src = S.doc.original; $("#lbB").src = S.doc.anonymized; $("#lbDl").href = `/agent/pdf/${S.docId}`; setLb(50); $("#lb").classList.add("open"); }
function closeLb(){ $("#lb").classList.remove("open"); }
$("#lbX").onclick = closeLb;
$("#lb").onclick = e => { if (e.target.id === "lb") closeLb(); };
$("#lbSl").oninput = e => setLb(e.target.value);
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => setLb(b.dataset.v));
$("#dV").onclick = async () => { if (!S.run) return; const r = await (await fetch(`/agent/audit/${S.run}/verify`)).json(); chain(r);
  $("#dB").insertAdjacentHTML("beforeend", `<div class="lg"><span class="${r.ok ? "ALLOW" : "BLOCK"}">${r.ok ? "✓ chain intact" : "✕ broken at #" + r.broken_at} · ${r.entries} entries re-hashed</span></div>`); $("#dB").scrollTop = 1e7; };
function chain(r){ $("#sChain").textContent = r.ok ? "✓ intact" : "✕ broken"; $("#sChain").style.color = r.ok ? "var(--ok)" : "var(--bad)"; }

/* visuals */
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
async function fetchDoc(id){ S.doc = await (await fetch("/agent/doc/" + id)).json(); S.docId = id;
  for (const k of ["original", "erased", "anonymized"]) if (S.doc[k]) S.imgs[k] = await load(S.doc[k]); }
const VB = () => `viewBox="0 0 ${S.doc.width} ${S.doc.height}" preserveAspectRatio="none"`;
const paper = inner => `<div class="paper fade">${inner}</div>`;
const rect = (b, fill, stroke, w = 3, dash) => { const [x1, y1, x2, y2] = b;
  return `<rect x="${x1 - 5}" y="${y1 - 4}" width="${x2 - x1 + 10}" height="${y2 - y1 + 8}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="${w}" ${dash ? 'stroke-dasharray="8 6"' : ""}/>`; };
function textSheet(color){
  return S.doc.lines.map((ln, i) => { const [x1, y1, x2, y2] = ln.box, h = y2 - y1;
    return `<text id="tl-${i}" x="${x1}" y="${y2 - h * .2}" font-size="${h * .8}" textLength="${Math.max(10, x2 - x1)}" lengthAdjust="spacingAndGlyphs" fill="${color}" font-family="-apple-system, Helvetica">${esc(ln.text)}</text>`; }).join("");
}

async function showOCR(){
  const st = stage("ocr");
  st.innerHTML = paper(`<img src="${S.doc.original}"><svg ${VB()} id="ob"></svg>`);
  await sleep(500);
  const ob = $("#ob"), n = S.doc.lines.length, gap = Math.min(120, 3000 / Math.max(1, n));
  for (const ln of S.doc.lines){ ob.insertAdjacentHTML("beforeend", `<g class="fade">${rect(ln.box, "rgba(79,70,229,.10)", "#4f46e5", 2.5)}</g>`); await sleep(gap); }
  await sleep(500);
  st.insertAdjacentHTML("beforeend", `<div class="arrow"></div>`);
  await sleep(600);
  st.insertAdjacentHTML("beforeend", paper(`<svg ${VB()}>${textSheet("#4f46e5")}</svg>`));
  await sleep(1300);
  const words = S.doc.lines.reduce((a, l) => a + l.text.split(/\s+/).filter(Boolean).length, 0);
  kv("ocr", "lines", n); kv("ocr", "words", words);
}
function gemmaStart(){
  stage("gemma").innerHTML = paper(`<svg ${VB()} id="gs">${textSheet("#a1a1aa")}</svg>`) +
    `<div class="rows" style="max-width:230px"><div class="row" id="r-analyst"><span class="ic">·</span>Whose document?<small></small></div>
     <div class="row" id="r-sentinel"><span class="ic">·</span>Hidden instructions?<small></small></div></div>`;
}
function markInj(i){ if (S.inj.has(i)) return; S.inj.add(i); const t = document.getElementById("tl-" + i); if (!t) return;
  t.setAttribute("fill", "#e11d48"); t.insertAdjacentHTML("beforebegin", rect(S.doc.lines[i].box, "rgba(225,29,72,.08)", "#e11d48", 2.5)); }
function agentRow(name, ms){ const r = document.getElementById("r-" + name); if (!r || r.className.includes("ok")) return;
  r.className = "row ok"; r.querySelector(".ic").textContent = "✓"; r.querySelector("small").textContent = (ms / 1000).toFixed(1) + "s"; }

async function showGuard(){
  const d = S.doc;
  stage("guard").innerHTML = paper(`<img src="${d.original}"><svg ${VB()} id="gb"></svg>`);
  await sleep(600);
  const gb = $("#gb");
  for (const k of d.kept){ gb.insertAdjacentHTML("beforeend", `<g class="fade">${rect(k.box, "rgba(161,161,170,.10)", "#a1a1aa", 2.5, true)}</g>`); await sleep(90); }
  for (const q of d.quarantined){ gb.insertAdjacentHTML("beforeend", `<g class="fade">${rect(q.box, "rgba(225,29,72,.12)", "#e11d48", 3)}</g>`); await sleep(150); }
  for (const it of d.items){ gb.insertAdjacentHTML("beforeend", `<g class="fade">${rect(it.box, "rgba(5,150,105,.16)", "#059669", 3.5)}</g>`); await sleep(220); }
  await sleep(300);
  kv("guard", "yours → replace", d.items.length, "g"); kv("guard", "others' → keep", d.kept.length);
  if (d.quarantined.length) kv("guard", "injected → ignored", d.quarantined.length, "r");
}
async function wipe(id, from, to, color){
  const d = S.doc;
  stage(id).innerHTML = paper(`<canvas id="cv-${id}" width="${d.width}" height="${d.height}"></canvas>`);
  const g = document.getElementById("cv-" + id).getContext("2d"); g.drawImage(from, 0, 0);
  await sleep(500);
  for (const it of d.items){
    const [x1, y1, x2, y2] = it.box, x = Math.max(0, x1 - 6), y = Math.max(0, y1 - 6), w = Math.min(d.width - x, x2 - x1 + 50), h = Math.min(d.height - y, y2 - y1 + 12);
    for (let k = 1; k <= 10; k++){ g.drawImage(from, x, y, w, h, x, y, w, h); g.drawImage(to, x, y, w * k / 10, h, x, y, w * k / 10, h);
      g.fillStyle = color; g.fillRect(x + w * k / 10 - 3, y, 3, h); await sleep(30); }
    g.drawImage(to, x, y, w, h, x, y, w, h); await sleep(140);
  }
  g.drawImage(to, 0, 0);
}
async function showPaint(){
  await wipe("paint", S.imgs.erased, S.imgs.anonymized, "#059669");
  const seen = new Set(), pairs = S.doc.items.filter(it => it.fake && it.fake !== it.text && !seen.has(it.text) && seen.add(it.text)).slice(0, 5);
  stage("paint").insertAdjacentHTML("beforeend", `<div class="side">${pairs.map((it, i) => `<div class="pair" style="animation-delay:${i * .25}s"><s>${esc(it.text)}</s><b>${esc(it.fake)}</b></div>`).join("")}</div>`);
  const fam = S.doc.render.find(r => r.doc_family)?.doc_family;
  kv("paint", "values redrawn", S.doc.items.length, "g"); if (fam) kv("paint", "font matched", fam);
}
async function showVerify(){
  const d = S.doc, W = Math.round(d.width / 2), H = Math.round(d.height / 2);
  stage("verify").innerHTML = paper(`<canvas id="cvd" width="${W}" height="${H}"></canvas>`);
  const grab = img => { const k = document.createElement("canvas"); k.width = W; k.height = H; const x = k.getContext("2d"); x.drawImage(img, 0, 0, W, H); return x.getImageData(0, 0, W, H).data; };
  const a = grab(S.imgs.original), b = grab(S.imgs.anonymized), g = $("#cvd").getContext("2d"), o = g.createImageData(W, H);
  for (let i = 0; i < a.length; i += 4){
    const df = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]), l = (a[i] + a[i + 1] + a[i + 2]) / 3;
    if (df > 30){ o.data[i] = 225; o.data[i + 1] = 29; o.data[i + 2] = 72; } else { const v = 255 - (255 - l) * .18; o.data[i] = o.data[i + 1] = o.data[i + 2] = v; }
    o.data[i + 3] = 255;
  }
  g.putImageData(o, 0, 0);
  await sleep(1100);
  const v = d.verify, left = v.ghost_items.length + v.leaked_items.length;
  kv("verify", "readable leftovers", left, left ? "r" : "g");
  kv("verify", "px changed elsewhere", v.pixels_changed_outside_boxes, v.pixels_changed_outside_boxes ? "y" : "g");
}
function showResult(){
  const d = S.doc;
  stage("result").innerHTML = `<div class="cmp fade"><img src="${d.original}"><img class="over" id="ov" src="${d.anonymized}"><div class="bar" id="bar"></div>
      <span class="tag" style="left:10px">ORIGINAL</span><span class="tag" style="right:10px;background:rgba(5,150,105,.9)">ANONYMISED</span><input type="range" id="sl" value="50"><button class="expand" id="ex" title="Full screen">⤢</button></div>
    <div class="chatbox fade"><h3>Ask Gemini, privately</h3><p>Gemini only ever sees your anonymised copy. Answers are mapped back to you on this Mac.</p>
      <div class="msgs" id="msgs"></div>
      <div class="ask"><input id="q" value="Was bedeutet das für mich und was soll ich tun?"><button class="btn go" id="ask">Ask</button></div>
      <div class="mini"><button id="rt">Try to leak raw data</button><button id="tp">Tamper with audit log</button><button id="fs">Full screen</button><a href="/agent/pdf/${S.docId}" target="_blank">Download PDF</a></div></div>`;
  $("#sl").oninput = e => { $("#ov").style.clipPath = `inset(0 0 0 ${e.target.value}%)`; $("#bar").style.left = e.target.value + "%"; };
  $("#ask").onclick = ask; $("#q").onkeydown = e => e.key === "Enter" && ask();
  $("#rt").onclick = redteam; $("#tp").onclick = tamper;
  $("#ex").onclick = $("#fs").onclick = openLb;
}

/* events */
const Q = []; let busy = false;
const push = ev => { Q.push(ev); if (!busy) pump(); };
async function pump(){ busy = true; while (Q.length){ try { await handle(Q.shift()); } catch (e){ console.error(e); } } busy = false; }
function flush(id){ S.pend.forEach(e => log(id, e)); S.pend = []; }

async function handle(ev){
  S.all.push(ev);
  if (ev.kind === "model_start" && ev.zone === "cloud"){ S.cloud++; $("#sCloud").textContent = S.cloud; }
  const k = ev.kind, n = ev.name;

  if (k === "run_start"){
    log("intake", ev);
    if (ev.agent === "gatekeeper"){
      await activate("intake");
      const fn = ev.detail.split("/").pop(), ext = (fn.split(".").pop() || "").toUpperCase();
      stage("intake").innerHTML = `<div class="rows" style="display:flex;flex-direction:column;align-items:center">
        <div class="paper mini fade"><div class="lines"><i></i><i></i><i></i><i style="width:55%"></i><i></i><i style="width:70%"></i></div><span class="ext">${esc(ext)}</span></div>
        <div class="file">${esc(fn)}<small id="fp">&nbsp;</small></div><div id="gate" style="width:100%"></div></div>`;
    }
    return;
  }
  if (k === "policy" && ev.agent === "gatekeeper" && n !== "content_gate"){
    log("intake", ev);
    if (n === "fingerprint"){ $("#fp").textContent = ev.detail.split(" · first")[0]; await sleep(500); return; }
    $("#gate").insertAdjacentHTML("beforeend", `<div class="row ${ev.decision === "BLOCK" ? "bad" : "ok"}"><span class="ic">${ev.decision === "BLOCK" ? "✕" : "✓"}</span>${GATE[n] || n}</div>`);
    await sleep(750);
    return;
  }
  if (k === "run_end"){
    S.done = true;
    if (ev.agent === "gatekeeper"){ log("intake", ev); const r = S.all.filter(e => e.decision === "BLOCK").pop(); await block("intake", r ? r.detail : ev.detail); return; }
    log(S.blocked ? S.cur : "result", ev);
    if (S.blocked) return;
    if (ev.error){ await block(S.cur || "intake", ev.detail); return; }
    if (S.cur !== "result"){ await activate("result"); showResult(); }
    await finish("result", "ready");
    fetch(`/agent/audit/${S.run}/verify`).then(r => r.json()).then(chain);
    return;
  }
  if (n === "content_gate"){ log("ocr", ev); if (ev.decision === "BLOCK"){ await sleep(600); await block("ocr", "No document text found. This looks like a photo, so the agents stop here."); } return; }
  if (n === "path_guard"){ log("intake", ev); await block("intake", ev.detail); return; }
  if (n === "injection_rules" || n === "injection_sentinel"){ log("gemma", ev); const m = ev.detail.match(/L(\d+)/); if (m) markInj(+m[1]); return; }
  if (["sentinel_check", "quarantine_filter", "subject_check", "scope_rules"].includes(n)){ log("guard", ev); return; }
  if (n === "verifier_check"){ log("verify", ev); return; }
  if (ev.agent === "analyst" || ev.agent === "sentinel"){ log("gemma", ev); if (k === "model_end") agentRow(ev.agent, ev.ms); return; }
  if (ev.agent === "verifier"){ log("verify", ev); return; }
  if (ev.agent === "assistant"){ log("result", ev); return; }

  if (k === "tool_start"){
    const id = TOOL[n]; if (!id) return;
    if (n === "load_document") await finish("intake", "passed");
    const again = card(id).dataset.s === "ok";
    if (S.cur !== id) await activate(id);
    if (again) setS(id, "run", "retrying");
    if (id === "gemma") gemmaStart();
    if (id === "result") showResult();
    log(id, ev); flush(id); return;
  }
  if (k === "tool_end"){
    const id = TOOL[n]; if (!id) return; log(id, ev); if (id === "erase") log("paint", ev);
    if (/^\{"error"/.test(ev.detail) && !S.blocked){ let m = ev.detail; try { m = JSON.parse(ev.detail).error; } catch {} await block(id, m.replace(/^policy:\s*/, "")); }
    return;
  }
  if (k === "state"){
    log(S.cur || "intake", ev);
    await fetchDoc(ev.doc_id);
    if (n === "loaded"){ await showOCR(); await finish("ocr"); }
    if (n === "analysed"){
      (S.doc.quarantined || []).forEach(q => markInj(q.line));
      kv("gemma", "hidden instructions found", S.inj.size, S.inj.size ? "r" : "g");
      await finish("gemma");
      await activate("guard"); await showGuard(); await finish("guard");
    }
    if (n === "redacted"){
      if (S.cur !== "erase") await activate("erase");
      await wipe("erase", S.imgs.original, S.imgs.erased, "#4f46e5");
      card("erase").querySelectorAll(".kv").forEach(x => x.remove()); kv("erase", "areas erased", S.doc.items.length);
      await finish("erase");
      await activate("paint"); card("paint").querySelectorAll(".kv").forEach(x => x.remove()); await showPaint(); await finish("paint");
    }
    if (n === "verified"){
      card("verify").querySelectorAll(".kv").forEach(x => x.remove());
      await showVerify(); const v = S.doc.verify; await finish("verify", v.ghost_items.length + v.leaked_items.length ? "retrying" : "clean");
    }
    return;
  }
  S.pend.push(ev);  // coordinator decisions, firewall + allow-list checks → logged with the step they lead to
}

/* run */
async function start(form){
  reset(); build(); $("#drawer").classList.remove("open"); $("#sChain").textContent = "—"; $("#sChain").style.color = ""; $("#sCloud").textContent = 0;
  $("#go").disabled = true;
  const t0 = performance.now(); clearInterval(window._tm);
  window._tm = setInterval(() => { if (!S.done) $("#sTime").textContent = ((performance.now() - t0) / 1000).toFixed(1) + "s"; }, 100);
  const r = await (await fetch("/agent/run", {method:"POST", body:form})).json();
  S.run = r.run_id;
  const es = new EventSource(`/agent/events/${r.run_id}`);
  es.onmessage = m => push(JSON.parse(m.data));
  const end = () => { es.close(); $("#go").disabled = false; };
  es.addEventListener("end", end); es.onerror = end;
}
$("#go").onclick = () => { const f = new FormData(); f.append("sample", $("#sample").value); start(f); };
$("#file").onchange = e => { const f = new FormData(); f.append("file", e.target.files[0]); start(f); e.target.value = ""; };
$("#track").addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.target.closest(".msgs,.drawer")){ $("#track").scrollLeft += e.deltaY; e.preventDefault(); } }, {passive:false});

/* after the run */
const since = async () => (await (await fetch(`/agent/events_since/${S.run}?since=${S.all.length}`)).json()).forEach(push);
async function ask(){
  const q = $("#q").value.trim(); if (!q) return;
  const m = $("#msgs"); m.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div>`); $("#q").value = "";
  const r = await (await fetch("/agent/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({doc_id:S.docId, question:q})})).json();
  m.insertAdjacentHTML("beforeend", `<div class="msg cloud"><em>GEMINI · answering your anonymised copy</em>${esc((r.cloud_answer || "").slice(0, 700))}</div>`);
  m.scrollTop = 1e6; await sleep(900);
  m.insertAdjacentHTML("beforeend", `<div class="msg you"><em>YOU SEE · ${r.swapped_back} detail(s) restored on this Mac</em>${esc((r.answer || "").slice(0, 700))}</div>`);
  m.scrollTop = 1e6; since();
}
async function redteam(){
  const r = await (await fetch("/agent/redteam", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({doc_id:S.docId, question:""})})).json();
  $("#msgs").insertAdjacentHTML("beforeend", `<div class="note bad"><b>${r.blocked ? "Blocked." : "Not blocked!"}</b> Someone tried to send the raw document straight to Gemini. The firewall stopped it before it left this Mac.</div>`);
  $("#msgs").scrollTop = 1e6; since();
}
async function tamper(){
  const r = await (await fetch(`/agent/audit/${S.run}/tamper`, {method:"POST"})).json();
  $("#msgs").insertAdjacentHTML("beforeend", `<div class="note bad"><b>Tampering detected.</b> Entry #${r.edited_seq} was rewritten to hide a security event. The hash chain breaks at #${r.broken_at}.</div>`);
  $("#msgs").scrollTop = 1e6;
}

/* replay a finished run (demo backup / screenshots): /?replay=<run_id>&focus=<stage id> */
async function replay(id, focus){
  reset(); build(); S.run = id;
  const evs = await (await fetch(`/agent/events_since/${id}?since=0`)).json();
  evs.forEach(push);
  while (busy || Q.length) await sleep(200);
  $("#sTime").textContent = (evs.at(-1)?.ts || 0).toFixed(1) + "s";
  if (focus){  // start the view at this stage (screenshots)
    const t = $("#track"); t.style.scrollBehavior = "auto";
    STAGES.slice(0, IDX[focus]).forEach(x => { card(x.id).style.display = "none"; const l = $("#l-" + x.id); if (l) l.style.display = "none"; });
    $("#l-" + focus) && ($("#l-" + focus).style.display = "none"); t.scrollLeft = 0; }
  await sleep(1500); document.getAnimations().forEach(x => { try { if (x.effect.getTiming().iterations !== Infinity) x.finish(); } catch {} });
  document.body.dataset.ready = "1";
}

(async () => {
  build();
  const s = await (await fetch("/samples")).json();
  const P = new URLSearchParams(location.search);
  if (P.get("replay")) replay(P.get("replay"), P.get("focus"));
  $("#sample").innerHTML = s.samples.map(n => `<option value="${esc(n)}" ${n === "SAMPLE_Arztbrief_ATTACK.png" ? "selected" : ""}>${esc(n.replace(/\.(png|jpe?g|pdf)$/i, "").replace(/_/g, " "))}</option>`).join("");
})();
